<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <title>Jigsaw – PWA</title>
  <style>
    :root { --gap: 8px; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 0; background: #f7f7f7; color:#222; }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e5; padding: 10px 12px; display: flex; gap: 12px; align-items: center; z-index: 10; }
    header h1 { font-size: 18px; margin: 0; }
    main { padding: 12px; display: grid; gap: 12px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, input[type="file"], input[type="number"] { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 14px; }
    canvas { width: 100%; max-width: 1000px; background: #fff; border: 1px solid #ddd; border-radius: 8px; touch-action: none; }
    .hint { font-size: 12px; color: #666; }
    .success { padding: 10px; background: #eaffea; border: 1px solid #c7efc7; color: #206020; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <header><img src="icon-192.png" width="28" height="28" alt="" style="border-radius:6px"/><h1>🧩 Jigsaw (PWA)</h1></header>
  <main>
    <section class="bar">
      <input id="file" type="file" accept="image/*">
      <label>Aantal stukjes (max 600):
        <input id="pieces" type="number" min="12" max="600" step="6" value="120" style="width:90px">
      </label>
      <button id="shuffle">Schud & start</button>
      <button id="peek">Voorbeeld</button>
      <span class="hint">Zet op beginscherm voor app-gevoel • Werkt offline</span>
    </section>
    <canvas id="board" width="900" height="900" aria-label="puzzelbord"></canvas>
    <div id="done" class="success">🎉 Klaar! Nog een ronde?</div>
  </main>

<script>
// ===== DOM =====
const fileInput   = document.getElementById('file');
const piecesInput = document.getElementById('pieces');
const shuffleBtn  = document.getElementById('shuffle');
const peekBtn     = document.getElementById('peek');
const canvas      = document.getElementById('board');
const ctx         = canvas.getContext('2d', { willReadFrequently: true });
const doneEl      = document.getElementById('done');

// ===== State =====
let img = new Image();
let rows = 6, cols = 6;
let cellW = 0, cellH = 0, boardW = 0, boardH = 0;
let pieces = [];  // {r,c,x,y,edges:{top,right,bottom,left}}
let dragging = null, offset = {x:0,y:0};
let showPeek = false;

// ===== Helpers =====
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const rndTab = ()=>Math.random()<0.5?-1:1;  // -1 gat, +1 nok

// klassieke stijl + variatie
const STYLE = {
  neckRatio: 0.12,   // hals t.o.v. celmaat
  bulbRatio: 0.18,   // bol t.o.v. celmaat
  offsetMax: 0.25,   // max middenverschuiving vs. midden (als fractie van rand-lengte)
  sizeJitter: 0.18   // ± variatie in maat (0.18 = ±18%)
};

function chooseGrid(maxPieces, w, h){
  const target = w/h;
  let best={r:3,c:4,score:1e9,pcs:12};
  const rMax=Math.max(2,Math.ceil(Math.sqrt(maxPieces)));
  for(let r=2;r<=rMax*2;r++){
    const c=Math.floor(maxPieces/r); if(c<2) continue;
    const pcs=r*c; if(pcs>maxPieces) continue;
    const score=Math.abs(c/r-target)+(maxPieces-pcs)/maxPieces;
    if(score<best.score) best={r,c,score,pcs};
  }
  return {rows:best.r, cols:best.c};
}

function fitCanvasToImage(){
  const pad=24;
  const container = canvas.parentElement;
  const rect = container ? container.getBoundingClientRect()
                         : {width: window.innerWidth-pad, height: window.innerHeight-200};
  const maxW = Math.max(320, Math.floor(rect.width - pad));
  const maxH = Math.max(320, Math.floor(rect.height - 140));
  const scale = Math.min(maxW/img.naturalWidth, maxH/img.naturalHeight, 1);

  const prevW=canvas.width||0, prevH=canvas.height||0;

  boardW = Math.round(img.naturalWidth*scale);
  boardH = Math.round(img.naturalHeight*scale);
  canvas.width = boardW; canvas.height = boardH;

  if(pieces.length && prevW && prevH && (prevW!==boardW||prevH!==boardH)){
    const sx=boardW/prevW, sy=boardH/prevH;
    for(const p of pieces){ p.x*=sx; p.y*=sy; }
  }

  cellW = boardW/cols; cellH = boardH/rows;
}

// rand met hals + bol (alleen Bézier-curves → stabiel in Safari)
function edgePath(ctx, x1, y1, x2, y2, edge, orient){
  // Klassieke puzzel: smalle hals + ronde bol
  // edge.tab: 0 = vlak, +1 = nok (uit), -1 = gat (in)
  const tab = edge.tab;
  if (tab === 0) { ctx.lineTo(x2, y2); return; }
  
if (typeof piecePath !== 'function' && typeof drawPiecePath === 'function') {
  window.piecePath = (ctx, r, c, edges) => drawPiecePath(ctx, { r, c, edges });
}
  // Verhoudingen (iets ‘puzzelachtiger’ dan eerst)
  const S = Math.min(cellW, cellH);
  const size = 1 + (edge.sizeJitter || 0);       // bv. ±0.10
  const neck = S * 0.10 * size;                  // 10% hals
  const r    = S * 0.24 * size;                  // 24% bol-radius
  const off  = Math.max(-1, Math.min(1, edge.offset || 0)) * 0.20; // max 20% verschuiving

  if (orient === 'h') {
    // horizontale rand: links -> rechts langs y1
    const len = x2 - x1;
    const mid = x1 + len * (0.5 + off);
    const cy  = y1 - tab * (neck + r);

    // naar begin hals
    ctx.lineTo(mid - (r + neck), y1);
    // hals (zacht naar buiten)
    ctx.bezierCurveTo(
      mid - (r + neck*0.5), y1,
      mid - r,              y1 - tab*(neck*0.6),
      mid - r,              y1 - tab*neck
    );
    // bol (halve cirkel)
    ctx.arc(mid, cy, r, Math.PI, 0, tab > 0);
    // hals terug naar rand
    ctx.bezierCurveTo(
      mid + r,              y1 - tab*(neck*0.6),
      mid + (r + neck*0.5), y1,
      mid + (r + neck),     y1
    );
    ctx.lineTo(x2, y2);

  } else {
    // verticale rand: top -> bottom langs x1
    const len = y2 - y1;
    const mid = y1 + len * (0.5 + off);
    const cx  = x1 - tab * (neck + r);

    ctx.lineTo(x1, mid - (r + neck));
    ctx.bezierCurveTo(
      x1,              mid - (r + neck*0.5),
      x1 - tab*(neck*0.6), mid - r,
      x1 - tab*neck,       mid - r
    );
    ctx.arc(cx, mid, r, -Math.PI/2, Math.PI/2, tab < 0);
    ctx.bezierCurveTo(
      x1 - tab*(neck*0.6), mid + r,
      x1,                  mid + (r + neck*0.5),
      x1,                  mid + (r + neck)
    );
    ctx.lineTo(x2, y2);
  }
}

function randEdge(){             // willekeurige rand met variatie
  return {
    tab: rndTab(),
    offset: (Math.random()*2-1),              // -1..1 (we schalen met STYLE.offsetMax)
    sizeJitter: (Math.random()*2-1)*STYLE.sizeJitter // bv. ±0.18
  };
}

function buildPieces(){
  // 1) maak complementaire randen
  const edges=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const idx = r*cols + c;
      const top    = (r===0)      ? {tab:0} : (()=>{ const e = {...edges[(r-1)*cols+c].bottom}; e.tab*=-1; return e; })();
      const left   = (c===0)      ? {tab:0} : (()=>{ const e = {...edges[r*cols+(c-1)].right};  e.tab*=-1; return e; })();
      const right  = (c===cols-1) ? {tab:0} : randEdge();
      const bottom = (r===rows-1) ? {tab:0} : randEdge();
      edges[idx] = { top, right, bottom, left };
    }
  }

  // 2) init stukken
  pieces=[];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      pieces.push({
        r,c,
        x: Math.random()*(boardW-cellW),
        y: Math.random()*(boardH-cellH),
        edges: edges[r*cols+c]
      });
    }
  }
}

// VERVANGT drawPiecePath: zelfde vorm, maar heet 'piecePath' en gebruikt 'edges'
function piecePath(ctx, r, c, edges){
  const x = 0, y = 0;
  ctx.moveTo(x, y);
  edgePath(ctx, x,       y,        x+cellW, y,         edges.top,    'h'); // boven
  edgePath(ctx, x+cellW, y,        x+cellW, y+cellH,   edges.right,  'v'); // rechts
  edgePath(ctx, x+cellW, y+cellH,  x,       y+cellH,   edges.bottom, 'h'); // onder
  edgePath(ctx, x,       y+cellH,  x,       y,         edges.left,   'v'); // links
  ctx.closePath();
}

function draw(){
  ctx.clearRect(0, 0, boardW, boardH);

  if (showPeek) {
    ctx.globalAlpha = 0.15;
    ctx.drawImage(img, 0, 0, boardW, boardH);
    ctx.globalAlpha = 1;
  }

  for (const p of pieces) {
    const sx = p.c * (img.naturalWidth / cols);
    const sy = p.r * (img.naturalHeight / rows);
    const sw = img.naturalWidth  / cols;
    const sh = img.naturalHeight / rows;

    ctx.save();
    ctx.translate(p.x, p.y);

    // 1) Omtrek tekenen zodat je ALTIJD iets ziet
    ctx.beginPath();
    if (typeof piecePath === 'function') {
      piecePath(ctx, p.r, p.c, p.edges);
    } else if (typeof drawPiecePath === 'function') {
      drawPiecePath(ctx, p); // noodgreep
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 2) Clip + image binnen het stuk
    ctx.beginPath();
    if (typeof piecePath === 'function') {
      piecePath(ctx, p.r, p.c, p.edges);
    } else if (typeof drawPiecePath === 'function') {
      drawPiecePath(ctx, p);
    }
    ctx.clip();

    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, cellW, cellH);

    ctx.restore();
  }
}
}
  }
}

function isSolved(){
  const snap = Math.max(6, Math.round(Math.min(cellW,cellH)*0.02));
  return pieces.every(p => Math.abs(p.x-p.c*cellW)<snap && Math.abs(p.y-p.r*cellH)<snap);
}

function pickPiece(pt){
  for(let i=pieces.length-1;i>=0;i--){
    const p=pieces[i];
   
    if(hit){ pieces.splice(i,1); pieces.push(p); return p; }
  }
  return null;
}

function getPoint(evt){
  const r=canvas.getBoundingClientRect();
  const cx=('touches'in evt && evt.touches[0])?evt.touches[0].clientX:evt.clientX;
  const cy=('touches'in evt && evt.touches[0])?evt.touches[0].clientY:evt.clientY;
  return { x:(cx-r.left)*(boardW/r.width), y:(cy-r.top)*(boardH/r.height) };
}
function snapToGrid(p){ p.x=Math.round(p.x/cellW)*cellW; p.y=Math.round(p.y/cellH)*cellH; }

function onDown(e){ if(!img.src) return; e.preventDefault(); const pt=getPoint(e); dragging=pickPiece(pt); if(dragging) offset={x:pt.x-dragging.x,y:pt.y-dragging.y}; }
function onMove(e){ if(!dragging) return; e.preventDefault(); const pt=getPoint(e); dragging.x=clamp(pt.x-offset.x,0,boardW-cellW); dragging.y=clamp(pt.y-offset.y,0,boardH-cellH); draw(); }
function onUp(e){ if(!dragging) return; e.preventDefault(); snapToGrid(dragging); dragging=null; draw(); if(isSolved()) doneEl.style.display='block'; }

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});

window.addEventListener('resize', ()=>{ if(!img.src) return; fitCanvasToImage(); draw(); });

// ===== Load / shuffle =====
function newBoard(maxPieces){
  const g=chooseGrid(Math.min(600,Math.max(12,maxPieces|0)), img.naturalWidth,img.naturalHeight);
  rows=g.rows; cols=g.cols;
  fitCanvasToImage();
  buildPieces();
  doneEl.style.display='none';
  draw();
}
function loadFile(file){
  const url=URL.createObjectURL(file);
  img.onload=()=>newBoard(parseInt(piecesInput.value,10)||120);
  img.src=url;
}

fileInput.addEventListener('change', e=>{ const [f]=e.target.files; if(f) loadFile(f); });
piecesInput.addEventListener('change', ()=>{ if(img.src) newBoard(parseInt(piecesInput.value,10)||120); });
shuffleBtn.addEventListener('click', ()=>{ if(img.src) newBoard(parseInt(piecesInput.value,10)||120); });
peekBtn.addEventListener('click', ()=>{ showPeek=!showPeek; peekBtn.textContent=showPeek?'Verberg voorbeeld':'Voorbeeld'; draw(); });

if('serviceWorker' in navigator){ window.addEventListener('load', ()=>navigator.serviceWorker.register('./service-worker.js')); }
</script>
</body>
</html>
