<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <title>Jigsaw – PWA</title>
  <style>
    :root { --gap: 8px; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; margin: 0; background: #f7f7f7; color:#222; }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e5; padding: 10px 12px; display: flex; gap: 12px; align-items: center; z-index: 10; }
    header h1 { font-size: 18px; margin: 0; }
    main { padding: 12px; display: grid; gap: 12px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, input[type="file"], select { padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 14px; }
    canvas { width: 100%; max-width: 840px; background: #fff; border: 1px solid #ddd; border-radius: 8px; touch-action: none; }
    .hint { font-size: 12px; color: #666; }
    .success { padding: 10px; background: #eaffea; border: 1px solid #c7efc7; color: #206020; border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <header><img src="icon-192.png" width="28" height="28" alt="" style="border-radius:6px"/><h1>🧩 Jigsaw (PWA)</h1></header>
  <main>
   <section class="bar">
  <input id="file" type="file" accept="image/*">
  <label>Aantal stukjes (max 600):
    <input id="pieces" type="number" min="12" max="600" step="6" value="120" style="width:90px">
  </label>
  <button id="shuffle">Schud & start</button>
  <button id="peek">Voorbeeld</button>
  <span class="hint">Zet op beginscherm voor app-gevoel • Werkt offline</span>
</section>
    <canvas id="board" width="900" height="900" aria-label="puzzelbord"></canvas>
    <div id="done" class="success">🎉 Klaar! Nog een ronde?</div>
  </main>
<script>
const fileInput = document.getElementById('file');
const gridSel = document.getElementById('grid');
const shuffleBtn = document.getElementById('shuffle');
const peekBtn = document.getElementById('peek');
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const doneEl = document.getElementById('done');

let img = new Image();
let rows = 6, cols = 6;
let cellW = 0, cellH = 0;
let pieces = [];
let dragging = null;
let offset = {x:0,y:0};
let showPeek = false;

function fitCanvasToImage() {
  const max = 900;
  let w = img.naturalWidth, h = img.naturalHeight;
  const scale = Math.min(max / w, max / h, 1);
  w = Math.round(w * scale); h = Math.round(h * scale);
  canvas.width = w; canvas.height = h;
  cellW = w / cols; cellH = h / rows;
}
function makePieces(){ pieces=[]; for(let r=0;r<rows;r++) for(let c=0;c<cols;c++) pieces.push({r,c,x:Math.random()*(canvas.width-cellW),y:Math.random()*(canvas.height-cellH)}); }
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if (showPeek) { ctx.globalAlpha=0.15; ctx.drawImage(img,0,0,canvas.width,canvas.height); ctx.globalAlpha=1; }
  for (const p of pieces) {
    const sx = p.c * (img.naturalWidth/cols);
    const sy = p.r * (img.naturalHeight/rows);
    ctx.drawImage(img, sx, sy, img.naturalWidth/cols, img.naturalHeight/rows, p.x, p.y, cellW, cellH);
    ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.strokeRect(p.x,p.y,cellW,cellH);
  }
}
function isSolved(){ const s=6; return pieces.every(p=>Math.abs(p.x-p.c*cellW)<s && Math.abs(p.y-p.r*cellH)<s); }
function shuffle(){ makePieces(); draw(); doneEl.style.display='none'; }
function loadFile(file){ const url = URL.createObjectURL(file); img.onload=()=>{ rows=cols=parseInt(gridSel.value,10); fitCanvasToImage(); shuffle(); draw(); }; img.src=url; }
fileInput.addEventListener('change', e=>{ const [file]=e.target.files; if(file) loadFile(file); });
gridSel.addEventListener('change', ()=>{ if(img.src){ rows=cols=parseInt(gridSel.value,10); fitCanvasToImage(); shuffle(); draw(); }});
shuffleBtn.addEventListener('click', ()=>{ if(img.src) shuffle(); });
peekBtn.addEventListener('click', ()=>{ showPeek=!showPeek; peekBtn.textContent=showPeek?'Verberg voorbeeld':'Voorbeeld'; draw(); });
function getPoint(evt){ const r=canvas.getBoundingClientRect(); if(evt.touches&&evt.touches[0]) return {x:(evt.touches[0].clientX-r.left)*(canvas.width/r.width), y:(evt.touches[0].clientY-r.top)*(canvas.height/r.height)}; return {x:(evt.clientX-r.left)*(canvas.width/r.width), y:(evt.clientY-r.top)*(canvas.height/r.height)}; }
function pickPiece(pt){ for(let i=pieces.length-1;i>=0;i--){ const p=pieces[i]; if(pt.x>=p.x&&pt.x<=p.x+cellW&&pt.y>=p.y&&pt.y<=p.y+cellH){ pieces.splice(i,1); pieces.push(p); return p; } } return null; }
function snapToGrid(p){ p.x=Math.round(p.x/cellW)*cellW; p.y=Math.round(p.y/cellH)*cellH; }
function onDown(e){ if(!img.src) return; e.preventDefault(); const pt=getPoint(e); dragging=pickPiece(pt); if(dragging) offset={x:pt.x-dragging.x,y:pt.y-dragging.y}; }
function onMove(e){ if(!dragging) return; e.preventDefault(); const pt=getPoint(e); dragging.x=Math.max(0,Math.min(canvas.width-cellW,pt.x-offset.x)); dragging.y=Math.max(0,Math.min(canvas.height-cellH,pt.y-offset.y)); draw(); }
function onUp(e){ if(!dragging) return; e.preventDefault(); snapToGrid(dragging); dragging=null; draw(); if(isSolved()) doneEl.style.display='block'; }
canvas.addEventListener('mousedown', onDown); canvas.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false}); canvas.addEventListener('touchmove', onMove, {passive:false}); canvas.addEventListener('touchend', onUp, {passive:false});
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js')); }
</script>
</body>
</html>
