<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <title>Jigsaw – PWA</title>
  <style>
    :root { --gap: 8px; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
      margin: 0; background: #f7f7f7; color:#222;
    }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #e5e5e5;
      padding: 10px 12px; display: flex; gap: 12px; align-items: center; z-index: 10; }
    header h1 { font-size: 18px; margin: 0; }
    main { padding: 12px; display: grid; gap: 12px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button, input[type="file"], input[type="number"] {
      padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; font-size: 14px;
    }
    canvas {
      width: 100%; max-width: 1100px; background: #fff; border: 1px solid #ddd; border-radius: 8px;
      touch-action: none;
    }
    .hint { font-size: 12px; color: #666; }
    .success { padding: 10px; background: #eaffea; border: 1px solid #c7efc7; color: #206020;
      border-radius: 8px; display: none; }
  </style>
</head>
<body>
  <header>
    <img src="icon-192.png" width="28" height="28" alt="" style="border-radius:6px"/>
    <h1>🧩 Jigsaw (PWA)</h1>
  </header>

  <main>
    <section class="bar">
      <input id="file" type="file" accept="image/*">
      <label>Aantal stukjes (max 600):
        <input id="piecesInput" type="number" min="12" max="600" step="6" value="120" style="width:7rem">
      </label>
      <button id="shuffle">Schud & start</button>
      <button id="peek">Voorbeeld</button>
      <span class="hint">Zet op beginscherm voor app-gevoel • Werkt offline</span>
    </section>

    <canvas id="board" width="900" height="900" aria-label="puzzelbord"></canvas>
    <div id="done" class="success">🎉 Klaar! Nog een ronde?</div>
  </main>

<script>
/* ======== Globale variabelen ======== */
const fileInput = document.getElementById('file');
const piecesInput = document.getElementById('piecesInput');
const shuffleBtn = document.getElementById('shuffle');
const peekBtn = document.getElementById('peek');
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const doneEl = document.getElementById('done');

let img = new Image();
let rows = 6, cols = 6;
let cellW = 0, cellH = 0, boardW = 0, boardH = 0;
let pieces = [];           // ← blijft bewust globaal (handig voor debug)
let dragging = null;
let offset = {x:0,y:0};
let showPeek = false;

/* ======== Helpers: grid en canvas ======== */
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

function chooseGridFromCount(n, w, h){
  n = clamp(n|0, 12, 600);
  const aspect = w / h;           // >1 = breed
  let best = {r:3, c:4, diff:1e9};

  for (let r = 3; r <= 30; r++){         // redelijke grenzen
    for (let c = 3; c <= 30; c++){
      const count = r*c;
      if (count > n) continue;
      // match op aantal en aspect
      const gridAspect = c / r;
      const d = Math.abs(n - count) + 0.25*Math.abs(Math.log(gridAspect/aspect));
      if (d < best.diff) best = {r, c, diff:d};
    }
  }
  return { rows: best.r, cols: best.c };
}

function fitCanvasToImage() {
  // pas bord aan aan venster en afbeelding, max ~1100px breed
  const maxW = Math.min(1100, window.innerWidth - 24);
  const maxH = Math.min(1100, window.innerHeight - 180);
  const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
  boardW = Math.round(img.naturalWidth * scale);
  boardH = Math.round(img.naturalHeight * scale);
  canvas.width = boardW;
  canvas.height = boardH;
  cellW = boardW / cols;
  cellH = boardH / rows;
}

/* ======== Randen: puzzelvorm ======== */
/** Tekent een rand met hals + “bol” (of gat).
 * ctx: canvas context, (x1,y1)->(x2,y2): rand, edge: {tab, sizeJitter, offset}, orient: 'h'|'v'
 * tab: 0 = vlak, +1 = nok (uit), -1 = gat (in) — relatief t.o.v. het stuk
 */
function edgePath(ctx, x1, y1, x2, y2, edge, orient){
  const tab = edge.tab|0;
  if (tab === 0) { ctx.lineTo(x2, y2); return; }

  const S = Math.min(cellW, cellH);
  const size = 1 + (edge.sizeJitter || 0);      // ± 0.10 bv.
  const neck = S * 0.10 * size;                 // hals
  const r    = S * 0.22 * size;                 // bol “radius”
  const off  = clamp(edge.offset || 0, -1, 1) * 0.18; // max 18% verschuiving

  const hor  = (orient === 'h');
  const len  = hor ? (x2-x1) : (y2-y1);
  const mid  = hor ? (x1+x2)/2 + off*len : (y1+y2)/2 + off*len;

  // normal-richting: naar buiten t.o.v. het stuk (boven/links = negatief)
  const nSign = hor ? (y1 === 0 ? -1 : +1) : (x1 === 0 ? -1 : +1);
  const bulge = nSign * (tab > 0 ? 1 : -1);

  if (hor){
    // naar midden-hals
    ctx.bezierCurveTo(x1 + neck, y1, mid - (r+neck), y1, mid - (r+neck/2), y1);
    // “bol” met twee beziers (stabiel in Safari)
    ctx.bezierCurveTo(
      mid - r*0.5, y1,
      mid - r*0.25, y1 + bulge * r,
      mid,         y1 + bulge * r
    );
    ctx.bezierCurveTo(
      mid + r*0.25, y1 + bulge * r,
      mid + r*0.5,  y1,
      mid + (r+neck/2), y1
    );
    // terug naar x2,y2
    ctx.bezierCurveTo(x2 - neck, y2, x2 - neck/3, y2, x2, y2);
  } else {
    // verticaal
    ctx.bezierCurveTo(x1, y1 + neck, x1, mid - (r+neck), x1, mid - (r+neck/2));
    ctx.bezierCurveTo(
      x1,           mid - r*0.5,
      x1 + bulge*r, mid - r*0.25,
      x1 + bulge*r, mid
    );
    ctx.bezierCurveTo(
      x1 + bulge*r, mid + r*0.25,
      x1,           mid + r*0.5,
      x1,           mid + (r+neck/2)
    );
    ctx.bezierCurveTo(x2, y2 - neck, x2, y2 - neck/3, x2, y2);
  }
}

/** Tekent de omtrek van één puzzelstuk (in lokale 0..cellW/0..cellH-coords). */
function drawPiecePath(ctx, p){
  const x = 0, y = 0;
  ctx.moveTo(x, y);
  edgePath(ctx, x, y, x+cellW, y,          p.edges.top,    'h'); // boven
  edgePath(ctx, x+cellW, y, x+cellW, y+cellH, p.edges.right,  'v'); // rechts
  edgePath(ctx, x+cellW, y+cellH, x, y+cellH, p.edges.bottom, 'h'); // onder
  edgePath(ctx, x, y+cellH, x, y,          p.edges.left,   'v'); // links
  ctx.closePath();
}

/* ======== Stukken maken & randen toewijzen ======== */
function makeEdgesAndPieces(){
  pieces = [];
  // maak grid met consistente tabs
  const rnd = () => (Math.random() < 0.5 ? -1 : +1);
  const jitter = () => (Math.random()*0.2 - 0.1); // ±0.10
  const offset = () => (Math.random()*2 - 1);     // -1..1

  const at = (r,c) => pieces[r*cols + c];

  // init lege stukken
  for (let r=0; r<rows; r++){
    for (let c=0; c<cols; c++){
      pieces.push({
        r, c,
        x: Math.random()*(boardW - cellW),
        y: Math.random()*(boardH - cellH),
        edges: { top:{tab:0}, right:{tab:0}, bottom:{tab:0}, left:{tab:0} }
      });
    }
  }
  // zet randen: binnen = ±1, buiten = 0
  for (let r=0; r<rows; r++){
    for (let c=0; c<cols; c++){
      const p = at(r,c);
      // rechts/links
      if (c < cols-1){
        const t = rnd();
        p.edges.right = { tab: t, sizeJitter: jitter(), offset: offset() };
        at(r,c+1).edges.left = { tab: -t, sizeJitter: jitter(), offset: offset() };
      }
      // onder/boven
      if (r < rows-1){
        const t = rnd();
        p.edges.bottom = { tab: t, sizeJitter: jitter(), offset: offset() };
        at(r+1,c).edges.top = { tab: -t, sizeJitter: jitter(), offset: offset() };
      }
    }
  }
  // borders blijven tab:0 (vlak)
  window.pieces = pieces; // voor debug
}

/* ======== Tekenloop ======== */
function draw(){
  ctx.clearRect(0,0,boardW,boardH);
  if (showPeek) { ctx.globalAlpha=0.15; ctx.drawImage(img,0,0,boardW,boardH); ctx.globalAlpha=1; }

  for (const p of pieces) {
    const sx = p.c * (img.naturalWidth / cols);
    const sy = p.r * (img.naturalHeight / rows);
    const sw = img.naturalWidth / cols;
    const sh = img.naturalHeight / rows;

    // inhoud
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.beginPath(); drawPiecePath(ctx,p); ctx.clip();
    ctx.drawImage(img, sx,sy,sw,sh, 0,0, cellW,cellH);
    ctx.restore();

    // lijn
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.beginPath(); drawPiecePath(ctx,p);
    ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=1; ctx.stroke();
    ctx.restore();
  }
}

function isSolved(){
  const snap = 6;
  return pieces.every(p =>
    Math.abs(p.x - p.c*cellW) < snap && Math.abs(p.y - p.r*cellH) < snap
  );
}

function shuffle(){
  for (const p of pieces){
    p.x = Math.random()*(boardW - cellW);
    p.y = Math.random()*(boardH - cellH);
  }
  dragging = null;
  doneEl.style.display='none';
  draw();
}

/* ======== Bestands- & UI-handlers ======== */
function startFromImage(){
  const N = parseInt(piecesInput.value,10) || 120;
  const g = chooseGridFromCount(N, img.naturalWidth, img.naturalHeight);
  rows = g.rows; cols = g.cols;
  fitCanvasToImage();
  makeEdgesAndPieces();
  shuffle();
  draw();
}

function loadFile(file){
  const url = URL.createObjectURL(file);
  img.onload = () => startFromImage();
  img.src = url;
}

fileInput.addEventListener('change', e => {
  const [file] = e.target.files;
  if (file) loadFile(file);
});
piecesInput.addEventListener('change', () => { if(img.src) startFromImage(); });
shuffleBtn.addEventListener('click', () => { if(img.src) shuffle(); });
peekBtn.addEventListener('click', () => { showPeek=!showPeek; peekBtn.textContent=showPeek?'Verberg voorbeeld':'Voorbeeld'; draw(); });

/* ======== Drag & drop ======== */
function getPoint(evt){
  const r = canvas.getBoundingClientRect();
  const scaleX = canvas.width / r.width;
  const scaleY = canvas.height / r.height;
  if (evt.touches && evt.touches[0]){
    return { x:(evt.touches[0].clientX - r.left) * scaleX,
             y:(evt.touches[0].clientY - r.top)  * scaleY };
  }
  return { x:(evt.clientX - r.left) * scaleX, y:(evt.clientY - r.top) * scaleY };
}

function pickPiece(pt){
  for (let i=pieces.length-1;i>=0;i--){
    const p = pieces[i];
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.beginPath(); drawPiecePath(ctx,p);
    const hit = ctx.isPointInPath(pt.x, pt.y);
    ctx.restore();
    if (hit){ pieces.splice(i,1); pieces.push(p); return p; }
  }
  return null;
}
function snapToGrid(p){
  p.x = Math.round(p.x/cellW)*cellW;
  p.y = Math.round(p.y/cellH)*cellH;
}

function onDown(e){
  if(!img.src) return;
  e.preventDefault();
  const pt = getPoint(e);
  dragging = pickPiece(pt);
  if (dragging) offset = {x: pt.x - dragging.x, y: pt.y - dragging.y};
}
function onMove(e){
  if(!dragging) return;
  e.preventDefault();
  const pt = getPoint(e);
  dragging.x = clamp(pt.x - offset.x, 0, boardW - cellW);
  dragging.y = clamp(pt.y - offset.y, 0, boardH - cellH);
  draw();
}
function onUp(e){
  if(!dragging) return;
  e.preventDefault();
  snapToGrid(dragging);
  dragging = null;
  draw();
  if (isSolved()) doneEl.style.display='block';
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);
canvas.addEventListener('touchstart', onDown, {passive:false});
canvas.addEventListener('touchmove', onMove, {passive:false});
canvas.addEventListener('touchend', onUp, {passive:false});

/* ======== Service worker ======== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js'));
}

/* ======== Kleine debug-hulpen ======== */
window.drawPiecePath = drawPiecePath;
window.edgePath = edgePath;
window.piecesRef = () => pieces;
</script>
</body>
</html>
